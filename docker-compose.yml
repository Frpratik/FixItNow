version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fixitnow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixitnow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fixitnow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - fixitnow-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixitnow-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fixitnow}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-fixitnow-production-grade-random-hex-string-32+chars}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-60}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      MAX_RADIUS_KM: ${MAX_RADIUS_KM:-10.0}
      FIRST_WAVE_SIZE: ${FIRST_WAVE_SIZE:-5}
      FIRST_WAVE_TIMEOUT_SEC: ${FIRST_WAVE_TIMEOUT_SEC:-60}
      EXPIRY_TIMEOUT_MIN: ${EXPIRY_TIMEOUT_MIN:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fixitnow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixitnow-frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      VITE_WS_URL: ws://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fixitnow-net

volumes:
  postgres_data:
    driver: local

networks:
  fixitnow-net:
    driver: bridge
